# Top conferences per CSRankings (https://csrankings.org/), grouped by
# CSRankings parent area and sub-area. `ccfddl` is the "<sub>/<title>" key
# of the matching entry in https://ccfddl.com/conference/allconf.yml, which
# the page fetches at load time. Entries without `ccfddl` have no upstream
# data and are listed with `link` only.
- name: AI
  areas:
    - key: ai
      name: Artificial intelligence
      confs:
        - name: AAAI
          ccfddl: AI/AAAI
        - name: IJCAI
          ccfddl: AI/IJCAI
    - key: vision
      name: Computer vision
      confs:
        - name: CVPR
          ccfddl: AI/CVPR
        - name: ECCV
          ccfddl: AI/ECCV
        - name: ICCV
          ccfddl: AI/ICCV
    - key: mlmining
      name: Machine learning
      confs:
        - name: ICLR
          ccfddl: AI/ICLR
        - name: ICML
          ccfddl: AI/ICML
        - name: NeurIPS
          ccfddl: AI/NeurIPS
        - name: KDD
          ccfddl: DB/SIGKDD
    - key: nlp
      name: Natural language processing
      confs:
        - name: ACL
          ccfddl: AI/ACL
        - name: EMNLP
          ccfddl: AI/EMNLP
        - name: NAACL
          ccfddl: AI/NAACL
    - key: inforet
      name: The Web & information retrieval
      confs:
        - name: SIGIR
          ccfddl: DB/SIGIR
        - name: WWW
          ccfddl: MX/WWW

